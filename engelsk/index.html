   IDEA: the season fixture list; every module is a match, every right answer a goal
   PICTURE: the stadium scoreboard over striped pitch grass, live score

:root{color-scheme:light dark;

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:clamp(16px,1.2vw + 12px,17px)/1.55 Barlow,system-ui,sans-serif;overflow-x:clip;
padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.board b{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(28px,3vw + 14px,40px);margin:0 0 .4em}
h3{font-size:clamp(21px,1.5vw + 14px,26px);margin:1.6em 0 .5em}
p{max-width:68ch}
a{color:inherit}

.skip:focus{top:calc(12px + env(safe-area-inset-top))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 6px light-dark(#fff,#0d1511);border-radius:6px}

button,a,select,summary,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

header svg.lines{position:absolute;inset:0;width:100%;height:100%;opacity:.25;pointer-events:none}

header h1{font-size:clamp(34px,4vw + 16px,56px);margin:0 0 8px}
header p{margin:0;color:#e9f3ec}

nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}

main{max-width:860px;margin:auto;padding:clamp(24px,4vw,48px) max(5vw,16px) 64px}
.tip{background:var(--card);border-left:6px solid var(--pitch2);border-radius:10px;padding:14px 18px;margin:12px 0}

fieldset{border:0;margin:0;padding:0}
fieldset.q{padding:16px}.q legend{float:left;width:100%}.q legend+*{clear:both}
.opts{display:grid;gap:8px}
button,.btn,select{font:inherit;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;cursor:pointer;text-align:left}

.opts button.right{background:var(--okbg);border-color:var(--ok);color:var(--ink)}

.fb{margin-top:10px;font-size:.97em}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}

.meter{height:8px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pitch2);transition:width .4s}
.sort{display:grid;gap:8px}
.sort label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;font-weight:600}
textarea{width:100%;min-height:clamp(240px,45dvh,420px);font:inherit;font-size:16px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.checks label{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 0}
.checks input{width:24px;height:24px;flex:none;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.small{font-size:14px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px}
@media(max-width:700px){
.hwrap{grid-template-columns:minmax(0,1fr);gap:14px}.sort label{grid-template-columns:minmax(0,1fr)}

.board{padding:10px 12px;box-shadow:0 6px 0 #0a0d0b}.board .tot{margin-top:6px;padding-top:6px}
html{scroll-padding-top:16px;scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
nav ul{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:4px}
nav a{flex-direction:column;justify-content:center;gap:0;min-height:58px;padding:4px 2px;border-radius:12px;text-align:center;line-height:1.15}
nav .n-l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}nav .n-s{display:block;font-size:15px}nav .n-p{font-size:13px}
main{padding-top:24px}
.q{padding:14px 12px}.text{padding:16px 14px}
footer{padding-bottom:16px}
}
@media(max-width:360px){nav .n-s{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

{title:"The Academy Dream",body:`<p>Jamal Okafor is fifteen and lives in Manchester. Four evenings a week, he takes two buses to a football academy on the edge of the city. He trains for two hours, eats dinner on the bus and starts his homework at nine o'clock.</p>
<p>"People think it's glamorous," Jamal says, "but most nights I'm just tired." His coaches are strict about school, too. Players who fall behind in maths or English can lose their place in the squad for a weekend.</p>
<p>Jamal knows the numbers. Only a small fraction of boys who join professional academies ever play a professional match. Many are released at sixteen or eighteen, and some find it hard to cope when the dream suddenly ends. That is why his mother insists on a plan B. "You can be a footballer and still have a brain," she tells him.</p>
<p>Jamal has started to listen. He enjoys science and is thinking about becoming a physiotherapist. "If football doesn't work out, I still want to work with football," he explains. "I just want to be ready."</p>

{title:"Coding in Te Reo",body:`<p>Aroha is fourteen and lives in Auckland, New Zealand. Like many teenagers, she spends a lot of her free time gaming. Unlike most of them, she is also building her own game – and every word in it is in te reo Māori, the language of New Zealand's Indigenous people.</p>
<p>For many years, te reo Māori was discouraged in schools, and the number of fluent speakers fell sharply. Since the 1980s, communities have worked hard to bring the language back, with Māori-language preschools, schools, radio and TV. Today, te reo is an official language of New Zealand, but most young people still mainly speak English.</p>
<p>"My grandmother speaks te reo, but I only learned it properly at school," Aroha says. "I thought, why are there no games in our language? So my cousin and I decided to make one."</p>
<p>Their game is about a young explorer who travels between islands and has to solve puzzles to find her way home. Players learn new words to unlock each level. Aroha's cousin draws the characters, while Aroha writes the code. They have tested it on younger kids at their local school, and the feedback was positive.</p>

const TASKS=[
["Argumenterende tekst","Should young people spend less time gaming? Write an argumentative text where you discuss both sides and give your own opinion. Give your text a title."],
["Novelle","Write a short story that starts with: «The final whistle had just blown when my phone buzzed.» Give your text a title."],
["Artikkel","Write an article for a school magazine about how clothes and fashion influence teenagers' identity. Give your text a title."],
["Engelskspråklig land","Choose an English-speaking country and write a text about what it is like to be a teenager there. Compare it with being a teenager in Norway."]];
const CHECK=["Jeg har en tittel som vekker interesse","Innledningen presenterer temaet og hva teksten skal handle om","Hvert avsnitt starter med en tydelig hovedsetning (topic sentence)","Jeg har brukt minst fem forskjellige bindeord","Jeg har en avslutning som oppsummerer – uten nye argumenter","Jeg har sjekket he/she/it + -s og riktig verbtid","Jeg har sjekket stor forbokstav (I, Monday, English, Norwegian)","Jeg har unngått gonna, wanna, kids og a lot of"];

const S={}; // answered: id -> true/false
let draft={};
try{draft=JSON.parse(localStorage.getItem("engelsk9-draft")||"{}")}catch(e){draft={}}
const live=document.getElementById("live");
const say=t=>{live.textContent="";setTimeout(()=>live.textContent=t,30)};
const count=p=>Object.keys(S).filter(k=>k.startsWith(p));
const tot={gram:GRAM.length+SPOT.length,ord:ORD.length,les:TEXTS.reduce((a,t)=>a+t.qs.length,0),skriv:LINK.length+1};
function score(p){return count(p).filter(k=>S[k]).length}
let cur="start";
function navDraw(h){cur=h;
document.getElementById("nav").innerHTML=[["start","Start","Start"],...Object.keys(M).map(k=>[k,M[k].name,M[k].short])].map(([k,n,s])=>`<li><a href="#${k}"${k===h?' aria-current="page"':""}><span class="n-l">${n}</span><span class="n-s" aria-hidden="true">${s}</span>${k==="start"?"":`<span class="n-p"><span class="sr">, </span>${score(k)}/${tot[k]}<span class="sr"> mål</span></span>`}</a></li>`).join("");
}
function navPts(){document.querySelectorAll("#nav a").forEach(a=>{const k=a.hash.slice(1),p=a.querySelector(".n-p");if(p&&tot[k])p.innerHTML=`<span class="sr">, </span>${score(k)}/${tot[k]}<span class="sr"> mål</span>`})}
function updBoard(){
if(document.getElementById("nav").children.length)navPts();
document.getElementById("board").innerHTML=Object.keys(M).map(k=>`<div><span>${M[k].short}</span><b>${score(k)}</b></div>`).join("");
const all=Object.keys(M).reduce((a,k)=>a+score(k),0),max=Object.values(tot).reduce((a,b)=>a+b,0);
document.getElementById("total").textContent=`Totalt ${all} av ${max} mål`;
}
const blank=s=>s.replace(/_{3}/g,'<span class="blank" aria-hidden="true"></span><span class="sr">(blank)</span>');
function mc(id,[stem,opts,ci,expl],n){
return `<fieldset class="q" id="${id}"><legend>${n?`<span class="sr">Oppgave </span>${n}. `:""}<span lang="en">${blank(stem)}</span></legend><div class="opts">${opts.map((o,i)=>`<button type="button" lang="en" data-q="${id}" data-i="${i}" data-c="${ci}">${o}</button>`).join("")}</div><div class="fb" role="status" aria-live="polite"><span hidden><b></b> ${expl}</span></div></fieldset>`;
}
function spot(id,[s,wi,expl],n){
const w=s.split(" ");
return `<fieldset class="q" id="${id}"><legend><span class="sr">Oppgave </span>${n}. Trykk på ordet som er feil: <span class="sr" lang="en">${s}</span></legend><div class="words" lang="en">${w.map((x,i)=>`<button type="button" data-q="${id}" data-i="${i}" data-c="${wi}">${x}</button>`).join("")}</div><div class="fb" role="status" aria-live="polite"><span hidden><b></b> ${expl}</span></div></fieldset>`;
}
function meter(p){return `<div class="meter" aria-hidden="true"><i style="width:${Math.round(score(p)/tot[p]*100)}%"></i></div>`}
const V={
start:()=>`<h2>Kampoppsett</h2><p>Tentamen i engelsk tester grammatikk, ordforråd, lesing og skriving. Ta én kamp om gangen – 20 minutter er nok per økt. Oppgavene er lagt på nivå 4–5, så det er helt greit å bomme. Les forklaringen etter hvert svar; det er der læringen skjer.</p>
<div class="cards">${Object.keys(M).map(k=>`<a href="#${k}"><b>${M[k].name}</b><span>${M[k].desc}</span><span class="small"> · ${score(k)}/${tot[k]}</span>${meter(k)}</a>`).join("")}</div>
<div class="tip"><b>Tentamenstips:</b><ul><li>Les oppgaveteksten to ganger og understrek hva du faktisk skal gjøre.</li><li>Bruk 10 minutter på å planlegge skriveoppgaven før du begynner.</li><li>Sett av 10 minutter til slutt til å lese gjennom for grammatikkfeil.</li></ul></div>`,
gram:()=>`<h2>Grammatikk</h2><div class="tip"><b>Husk:</b><ul><li><b>Past simple</b> (scored) = avsluttet tid: yesterday, last year, in 2024.</li><li><b>Present perfect</b> (have scored) = since, for, ever, never, already, yet.</li><li><b>He/she/it</b> får alltid -s i presens: she plays, he doesn't.</li></ul></div>
<h3>Velg riktig</h3>${GRAM.map((q,i)=>mc("gram-"+i,q,i+1)).join("")}
<h3>Finn feilen</h3><p>Dette er feil som norske elever ofte gjør. Finn ordet som må rettes.</p>${SPOT.map((q,i)=>spot("gram-s"+i,q,i+1)).join("")}
<button class="btn" data-reset="gram">Start grammatikk på nytt</button>`,
ord:()=>`<h2>Ordforråd</h2><div class="tip">Høy måloppnåelse handler ofte om <b>presise og varierte ord</b>. Bytt ut «good», «bad» og «a lot of» med mer presise ord når du skriver.</div>${ORD.map((q,i)=>mc("ord-"+i,q,i+1)).join("")}<button class="btn" data-reset="ord">Start ordforråd på nytt</button>`,
les:()=>`<h2>Lesing</h2><div class="tip"><b>Strategi:</b> Les spørsmålene <i>før</i> du leser teksten. Svarene står ofte i samme rekkefølge som i teksten. Ukjente ord? Se på setningen rundt.</div>
${TEXTS.map((t,ti)=>`<h3>Tekst ${ti+1}</h3><article class="text" lang="en" aria-label="${t.title}"><h4 style="font:700 clamp(22px,2vw + 14px,28px)/1.1 'Barlow Condensed',sans-serif;margin:0 0 .5em">${t.title}</h4>${t.body}</article>${t.qs.map((q,i)=>mc(`les-${ti}-${i}`,q,i+1)).join("")}`).join("")}
<button class="btn" data-reset="les">Start lesing på nytt</button>`,
skriv:()=>`<h2>Skriving</h2><div class="tip"><b>Oppskrift på en god tekst</b><ul><li><b>Innledning:</b> fang interesse, presenter temaet, si hva teksten skal gjøre.</li><li><b>Hoveddel:</b> 3 avsnitt. Hvert avsnitt = én hovedsetning + forklaring + eksempel.</li><li><b>Avslutning:</b> oppsummer og gi din mening – ingen nye argumenter.</li></ul></div>
<h3>1. Sorter bindeordene</h3><p>Velg hvilken jobb hvert bindeord gjør, og trykk «Sjekk».</p>
<div class="q sort" id="sort">${LINK.map(([w],i)=>`<label for="l${i}"><span lang="en">${w}</span><select id="l${i}"><option value="">Velg …</option>${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>`).join("")}
<div class="bar"><button class="primary" type="button" id="chk">Sjekk</button></div><div class="fb" role="status" id="sortfb"></div></div>
<h3>2. Velg den beste innledningen</h3>${mc("skriv-intro",INTRO)}
<h3>3. Skriv en tentamensoppgave</h3><p>Velg én oppgave. Skriv 350–500 ord. Teksten lagres i denne nettleseren mens du skriver.</p>
<label for="task" class="small">Oppgave</label><br><select id="task">${TASKS.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join("")}</select>
<p class="tip" lang="en" id="prompt"></p>
<label for="txt" class="sr">Teksten din</label><textarea id="txt" lang="en" spellcheck="true"></textarea>
<div class="bar"><span id="wc" aria-live="polite">0 ord</span><button type="button" class="btn" id="copy">Kopier teksten</button></div>
<details><summary>Se eksempel på et godt hoveddel-avsnitt</summary><p lang="en">One of the strongest arguments against gaming is that it can steal time from sleep. Many teenagers start a match late in the evening and end up playing until after midnight. As a result, they are tired at school the next day and find it harder to concentrate. However, this is not really a problem with gaming itself, but with a lack of routines.</p><p class="small">Se strukturen: hovedsetning → forklaring → eksempel/følge → motargument. Bindeord: As a result, However.</p></details>
<h3>4. Sjekkliste før du leverer</h3><div class="checks">${CHECK.map((c,i)=>`<label><input type="checkbox" id="c${i}"> <span>${c}</span></label>`).join("")}</div>`
};
const main=document.getElementById("main");
function route(focus){
let h=location.hash.slice(1);if(!V[h])h="start";
main.innerHTML=V[h]();
navDraw(h);
document.title=(h==="start"?"Start":M[h].name)+" – English Tentamen";
// restore answered
Object.keys(S).forEach(id=>{const f=document.getElementById(id);if(f&&f.dataset)mark(f,S[id+"_i"])});
if(h==="skriv")initWrite();
updBoard();
if(focus){main.focus({preventScroll:true});window.scrollTo(0,0)}
}
function mark(f,pick){
if(pick===undefined)return;
const bs=f.querySelectorAll("button[data-q]"),c=+bs[0].dataset.c,words=f.querySelector(".words");
bs.forEach((b,i)=>{b.setAttribute("aria-disabled","true");
if(i===c){b.classList.add("right");b.insertAdjacentHTML("beforeend",`<span class="tag" lang="nb">${words?"Feil ord":"Riktig"}</span>`)}
if(i===pick&&i!==c){b.classList.add("wrong");b.insertAdjacentHTML("beforeend",'<span class="tag" lang="nb">Ditt svar</span>')}});
const fb=f.querySelector(".fb"),sp=fb.firstElementChild;fb.className="fb "+(pick===c?"ok":"no");sp.querySelector("b").textContent=pick===c?"Mål! ":"Ikke helt. ";sp.hidden=false;
}
main.addEventListener("click",e=>{
const b=e.target.closest("button[data-q]");
if(b){const id=b.dataset.q,i=+b.dataset.i,ok=i===+b.dataset.c;if(id in S)return;
S[id]=ok;S[id+"_i"]=i;Object.defineProperty(S,id+"_i",{enumerable:false,value:i});
mark(document.getElementById(id),i);updBoard();say(ok?"Riktig, mål!":"Feil svar. Les forklaringen.");return}
const r=e.target.closest("[data-reset]");
if(r){const p=r.dataset.reset;Object.keys(S).filter(k=>k.startsWith(p)).forEach(k=>{delete S[k];delete S[k+"_i"]});route(true);say("Kampen er nullstilt.")}
});
function initWrite(){
const sel=document.getElementById("task"),tx=document.getElementById("txt"),pr=document.getElementById("prompt"),wc=document.getElementById("wc");
const save=()=>{try{localStorage.setItem("engelsk9-draft",JSON.stringify(draft))}catch(e){}};
const show=()=>{const i=sel.value;pr.textContent=TASKS[i][1];tx.value=draft[i]||"";words()};
const words=()=>{const n=(tx.value.match(/\b[\w'’-]+\b/g)||[]).length;wc.textContent=n+" ord"+(n>=350?" – bra lengde!":n>0?` (mål: 350–500)`:"")};
sel.value=draft.sel||0;show();
sel.addEventListener("change",()=>{draft.sel=sel.value;save();show()});
tx.addEventListener("input",()=>{draft[sel.value]=tx.value;save();words()});
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(tx.value);say("Teksten er kopiert.")}catch(e){tx.select();say("Kunne ikke kopiere automatisk. Teksten er markert – kopier den selv.")}});
CHECK.forEach((_,i)=>{const c=document.getElementById("c"+i);c.checked=!!(draft.ch||{})[i];c.addEventListener("change",()=>{draft.ch=draft.ch||{};draft.ch[i]=c.checked;save()})});
const sfb=document.getElementById("sortfb");
const done=count("skriv-l").length>0;
LINK.forEach(([,cat],i)=>{const s=document.getElementById("l"+i);if(done){s.value=cat;s.disabled=true}});
if(done)sfb.textContent=`Du fikk ${score("skriv-l")} av ${LINK.length} riktige.`;
document.getElementById("chk").addEventListener("click",()=>{
if(count("skriv-l").length)return;
let ok=0;const wrong=[];
LINK.forEach(([w,cat],i)=>{const s=document.getElementById("l"+i),r=s.value===cat;S["skriv-l"+i]=r;if(r)ok++;else wrong.push(`${w} = ${CAT[cat].toLowerCase()}`);s.value=cat;s.disabled=true});
sfb.innerHTML=`<b>${ok} av ${LINK.length} riktige.</b> `+(wrong.length?"Riktig svar for de du bommet på: "+wrong.join("; ")+".":"Perfekt!");
updBoard();say(`${ok} av ${LINK.length} riktige.`);
});
}
window.addEventListener("hashchange",()=>route(true));
route(false);
}
</script>
</body>
</html>
