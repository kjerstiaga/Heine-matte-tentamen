}

function gradeProve(){
const per={},wrong=[];let sc=0;
G.items.forEach((it,i)=>{per[it.sk]=per[it.sk]||[0,0];per[it.sk][1]++;let ok,yours,right,expl="";
if(it.t==="v"){const v=document.getElementById("gi"+i).value;const r=gradeW(it.w,v);ok=r.ok;yours=v.trim()||"(tomt)";right=W(it.w);expl=r.m;if(ok){if(vb(it.w)<2)L.box[it.w]=Math.max(vb(it.w),1)}else L.box[it.w]=1;L.seen[it.w]=TODAY}
else{const c=document.querySelector(`input[name="g${i}"]:checked`),[stem,opts,ci,ex]=it.g.q;ok=!!c&&+c.value===ci;yours=c?opts[+c.value]:"(ikke svart)";right=opts[ci];expl=ex;if(ok)delete L.gw[it.g.id];else L.gw[it.g.id]=1}
if(ok){sc++;per[it.sk][0]++}else wrong.push({n:i+1,it,yours,right,expl})});
const prev=L.hist[L.hist.length-1];L.hist.push({d:TODAY,sc,tot:G.items.length,pred:+G.pred});updBoard();
const diff=sc-(+G.pred);
G.res=`<h2 tabindex="-1">Resultat: ${sc} av ${G.items.length}</h2>
<p>Du tippet ${G.pred}. ${diff===0?"Helt presis vurdering av deg selv!":diff>0?`Du klarte ${diff} mer enn du trodde.`:`Du klarte ${-diff} mindre enn du trodde – nå vet du hva du skal øve på.`} ${prev?`Forrige generalprøve: ${prev.sc} av ${prev.tot}.`:""}</p>
<table><thead><tr><th>Ferdighet</th><th>Riktige</th></tr></thead><tbody>${Object.entries(per).map(([k,[a,b]])=>`<tr><td>${k}</td><td>${a} av ${b}</td></tr>`).join("")}</tbody></table>
${wrong.length?`<h3>Dette øver vi på videre</h3><p class="small">Feilene er lagt inn i Dagens kamp, så de kommer tilbake de neste dagene.</p>${wrong.map(x=>`<div class="q"><p style="margin:0 0 6px"><b>Oppgave ${x.n}</b> · Ditt svar: <span lang="de">${x.yours}</span> · Riktig: <b lang="de">${x.right}</b></p><p class="small" style="margin:0">${x.it.t==="v"?"":x.expl}</p></div>`).join("")}`:"<p>Alt riktig – sterkt!</p>"}
<div class="bar"><a class="btn primary" href="#start">Tilbake til start</a></div>`;
G.started=true;const r=G.res;G=null;main.innerHTML=r;const h=main.querySelector("h2");h.focus({preventScroll:true});main.scrollIntoView({block:"start"});say("Prøven er levert.");
}
